{% extends "admin_panel/base.html" %}
{% block title %}App Settings — Admin{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Application Configuration</h1>
<form method="post" class="bg-white rounded-xl shadow-sm p-5 max-w-2xl space-y-4">
  {% csrf_token %}
  <div class="border rounded-lg p-4 space-y-3">
    <h2 class="font-semibold text-sm">Maintenance mode</h2>
    <label class="text-sm flex items-center gap-2"><input type="checkbox" name="maintenance_enabled" {% if maintenance.enabled %}checked{% endif %}> Enabled (backend HTTP 503 for non-admin app users)</label>
    <input name="maintenance_message" value="{{ maintenance.message }}" class="w-full rounded border border-gray-200 px-3 py-2 text-sm" placeholder="Custom maintenance message">
  </div>
  <div class="border rounded-lg p-4 grid md:grid-cols-2 gap-3">
    <h2 class="font-semibold text-sm md:col-span-2">App</h2>
    <div><label class="text-xs text-gray-500 block">App name</label><input name="app_name" value="{{ app.name }}" class="w-full rounded border border-gray-200 px-2 py-1.5 text-sm"></div>
    <div><label class="text-xs text-gray-500 block">Support email</label><input name="support_email" value="{{ app.support_email }}" class="w-full rounded border border-gray-200 px-2 py-1.5 text-sm"></div>
    <div><label class="text-xs text-gray-500 block">Min app version</label><input name="min_app_version" value="{{ app.min_app_version }}" class="w-full rounded border border-gray-200 px-2 py-1.5 text-sm"></div>
    <label class="text-sm flex items-center gap-2 self-end"><input type="checkbox" name="force_update" {% if app.force_update %}checked{% endif %}> Force update below min version</label>
  </div>
  <div class="border rounded-lg p-4 space-y-3">
    <h2 class="font-semibold text-sm">Announcement</h2>
    <input name="announcement_title" placeholder="Title" class="w-full rounded border border-gray-200 px-3 py-2 text-sm">
    <textarea name="announcement_body" rows="2" placeholder="Body" class="w-full rounded border border-gray-200 px-3 py-2 text-sm"></textarea>
  </div>
  <button class="rounded-lg bg-[#16A34A] text-white text-sm px-4 py-2">Save settings</button>
</form>
{% endblock %}
