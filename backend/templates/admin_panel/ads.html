{% extends "admin_panel/base.html" %}
{% block title %}Ad Settings — Admin{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Advertisement Management</h1>
<form method="post" class="bg-white rounded-xl shadow-sm p-5 max-w-2xl">
  {% csrf_token %}
  <div class="grid md:grid-cols-2 gap-4 text-sm">
    <label class="flex items-center gap-2"><input type="checkbox" name="app_open_enabled" {% if setting.app_open_enabled %}checked{% endif %}> App Open Ads</label>
    <label class="flex items-center gap-2"><input type="checkbox" name="app_open_skip_first_launch" {% if setting.app_open_skip_first_launch %}checked{% endif %}> Skip first launch</label>
    <label class="flex items-center gap-2"><input type="checkbox" name="native_dashboard_enabled" {% if setting.native_dashboard_enabled %}checked{% endif %}> Dashboard native ad</label>
    <label class="flex items-center gap-2"><input type="checkbox" name="native_gallery_enabled" {% if setting.native_gallery_enabled %}checked{% endif %}> Gallery native ad</label>
    <label class="flex items-center gap-2"><input type="checkbox" name="banner_enabled" {% if setting.banner_enabled %}checked{% endif %}> Banner ads</label>
    <label class="flex items-center gap-2"><input type="checkbox" name="rewarded_enabled" {% if setting.rewarded_enabled %}checked{% endif %}> Rewarded ads</label>
    <label class="flex items-center gap-2"><input type="checkbox" name="test_mode" {% if setting.test_mode %}checked{% endif %}> Test ad units</label>
    <div><label class="text-xs text-gray-500 block">App Open max per day (0 = unlimited)</label>
      <input name="app_open_max_per_day" value="{{ setting.app_open_max_per_day }}" class="w-24 rounded border border-gray-200 px-2 py-1.5"></div>
  </div>
  <label class="text-xs text-gray-500 block mt-4">Ad unit IDs (JSON: {"app_open": "...", "native_dashboard": "...", "rewarded": "..."})</label>
  <textarea name="ad_unit_ids" rows="3" class="w-full rounded-lg border border-gray-200 font-mono text-xs p-2">{{ setting.ad_unit_ids|pprint }}</textarea>
  <div class="grid md:grid-cols-2 gap-4 mt-4 text-sm">
    <div class="border rounded-lg p-3">
      <label class="flex items-center gap-2 font-medium"><input type="checkbox" name="ai_enabled" {% if requirements.ai and requirements.ai.enabled %}checked{% endif %}> AI reward enabled</label>
      <label class="text-xs text-gray-500 block mt-2">Required ads per AI credit</label>
      <input name="ai_required_ads" value="{{ requirements.ai.required_ads|default:5 }}" class="w-24 rounded border border-gray-200 px-2 py-1.5">
    </div>
    <div class="border rounded-lg p-3">
      <label class="flex items-center gap-2 font-medium"><input type="checkbox" name="export_enabled" {% if requirements.export and requirements.export.enabled %}checked{% endif %}> Export reward enabled</label>
      <label class="text-xs text-gray-500 block mt-2">Required ads per export</label>
      <input name="export_required_ads" value="{{ requirements.export.required_ads|default:5 }}" class="w-24 rounded border border-gray-200 px-2 py-1.5">
    </div>
  </div>
  <button class="mt-5 rounded-lg bg-[#16A34A] text-white text-sm px-4 py-2">Save settings</button>
</form>
{% endblock %}
